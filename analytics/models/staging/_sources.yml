version: 2

sources:
  - name: weather
    description: Tablas cargadas por el pipeline ETL en Python (capa bronze/silver).
    schema: public
    tables:
      - name: dim_locations
        description: Ciudades monitoreadas.
        columns:
          - name: location_id
            data_tests:
              - unique
              - not_null

      - name: fact_weather_hourly
        description: Una fila por ciudad y hora (UTC), ya validada en Python con Pydantic.
        config:
          loaded_at_field: created_at
          freshness:
            warn_after: { count: 24, period: hour }
            error_after: { count: 48, period: hour }
        columns:
          - name: data_source
            data_tests:
              - accepted_values:
                  arguments:
                    values: ["forecast", "archive"]
