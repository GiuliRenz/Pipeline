[project]
name = "weather-pipeline"
version = "0.1.0"
description = "Pipeline ETL batch de datos meteorológicos (Open-Meteo → PostgreSQL) con validación de calidad de datos."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "requests>=2.32",
    "psycopg2-binary>=2.9.10",
    "python-dotenv>=1.0",
    "pydantic>=2.9",
]

[dependency-groups]
dbt = [
    "dbt-postgres>=1.9",
]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = [
    "integration: requiere una instancia de PostgreSQL en ejecución",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# E/F: errores básicos, I: orden de imports, UP: sintaxis moderna, B: bugs comunes
select = ["E", "F", "I", "UP", "B"]
